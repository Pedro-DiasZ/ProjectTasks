<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MyTasks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200..800&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar_dash">
    <h1 class="logo">My<span>Tasks</span></h1>

    <div id="switch" onclick="togglemode()" role="button" aria-label="Alternar tema" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ') { event.preventDefault(); togglemode(); }">
        <button></button>
        <span></span>
    </div>

    <div class="user_area">
        <span id="username"></span>
        <span id="separator">|</span>
        <span class="logout" onclick="logoutUser()">Sair</span>
    </div>
</nav>


<main class="main_dash">

    <!-- CARD TAREFAS -->
    <section class="card tasks_card">
        <div class="add_task">
            <input type="text" id="taskInput" placeholder="O que você precisa fazer hoje?">
            <button id="addTaskBtn" aria-label="Adicionar tarefa">+</button>
        </div>

        <ul id="taskList">
            <!-- tarefas entram aqui -->
        </ul>
    </section>

    <!-- CARD VAZIO -->
    <section class="card empty_card">
        <p>
            <strong>Tudo limpo por aqui!</strong><br>
            Adicione uma nova tarefa.
        </p>
    </section>

</main>

<script type="module" src="dashboard.js"></script>
</body>
</html>
